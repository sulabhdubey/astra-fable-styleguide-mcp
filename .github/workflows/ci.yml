name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:eslint
      - run: pnpm typecheck:full
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/test-dialog-boundaries.mjs
      - run: node scripts/test-installed-cli.mjs
      - run: node scripts/test-project-adoption.mjs
      - run: node scripts/test-running-app.mjs
      - run: node scripts/test-dembrandt-tokens.mjs
      - run: node scripts/test-studio.mjs
      - run: node scripts/test-studio-setup.mjs
      - run: node scripts/test-ci-workflow.mjs
      - run: node packages/cli/dist/stylecon.mjs check examples/profile --format sarif --output "$RUNNER_TEMP/stylecon.sarif"
      - uses: actions/upload-artifact@v4
        with:
          name: stylecon-example-report
          path: ${{ runner.temp }}/stylecon.sarif
      - run: pnpm validate
      - run: pnpm generate
      - run: pnpm build:docs
      - run: pnpm test:product
      - run: pnpm smoke:mcp
      - name: Package the development CLI
        run: |
          mkdir "$RUNNER_TEMP/stylecon-package"
          node scripts/package-cli.mjs "$RUNNER_TEMP/stylecon-package" --development
      - run: node scripts/verify-cli-archive.mjs "$RUNNER_TEMP/stylecon-package" --browser
      - uses: actions/upload-artifact@v4
        with:
          name: stylecon-cli-development
          path: |
            ${{ runner.temp }}/stylecon-package/*.tgz
            ${{ runner.temp }}/stylecon-package/install-cli.mjs
            ${{ runner.temp }}/stylecon-package/SHA256SUMS
            ${{ runner.temp }}/stylecon-package/package-evidence.json
            ${{ runner.temp }}/stylecon-package/archive-verification.json
          retention-days: 7
      - run: docker build -t style-constitution:ci .
      - run: docker build -f Dockerfile.vercel -t style-constitution:ci-vercel .
      - run: git diff --exit-code -- generated

