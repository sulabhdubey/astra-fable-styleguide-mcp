name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:eslint
      - run: pnpm typecheck:full
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/test-installed-cli.mjs
      - run: node packages/cli/dist/stylecon.mjs check examples/profile --format sarif --output "$RUNNER_TEMP/stylecon.sarif"
      - uses: actions/upload-artifact@v4
        with:
          name: stylecon-example-report
          path: ${{ runner.temp }}/stylecon.sarif
      - run: pnpm validate
      - run: pnpm generate
      - run: pnpm build:docs
      - run: pnpm test:product
      - run: pnpm smoke:mcp
      - run: docker build -t style-constitution:ci .
      - run: git diff --exit-code -- generated

