name: Release Gate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to verify
        required: true
      candidate_sha:
        description: Exact approved commit SHA to publish
        required: true
permissions: { contents: read }
concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false
jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved candidate commit
        env:
          APPROVED_SHA: ${{ github.event.inputs.candidate_sha || '' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release Gate must run from the protected main branch" >&2
            exit 1
          fi
          if [ -z "$APPROVED_SHA" ] || [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo "Approved candidate SHA must exactly match the checked-out commit" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:eslint
      - run: pnpm typecheck
      - run: pnpm typecheck:full
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/test-dialog-boundaries.mjs
      - run: pnpm test:product
      - run: pnpm repro
      - run: git diff --exit-code -- generated
      - run: pnpm smoke:mcp
      - run: pnpm run audit
      - run: pnpm audit
      - run: docker build -t style-constitution:release .
      - run: RELEASE_EVIDENCE_CONNECTED=1 pnpm evidence
      - id: release_version
        name: Verify and expose release version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          actual="$(node -p "require('./spec/manifest.json').version")"
          status="$(node -p "require('./spec/manifest.json').status")"
          if [ -n "$REQUESTED_VERSION" ] && [ "$actual" != "$REQUESTED_VERSION" ]; then
            echo "Requested release $REQUESTED_VERSION does not match manifest version $actual" >&2
            exit 1
          fi
          if [ "$status" != "released" ]; then
            echo "Manifest status must be released before publication; got $status" >&2
            exit 1
          fi
          if [ ! -f "docs/V${actual}_RELEASE_NOTES.md" ]; then
            echo "Version-specific release notes are required" >&2
            exit 1
          fi
          echo "version=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ steps.release_version.outputs.version }}
          path: releases/${{ steps.release_version.outputs.version }}-build-evidence.json
  publish-release:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: release-approval
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved publication commit
        env:
          APPROVED_SHA: ${{ github.event.inputs.candidate_sha || '' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo "Approved candidate SHA changed before publication" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ needs.verify-release.outputs.version }}
          path: releases
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          evidence="releases/${RELEASE_VERSION}-build-evidence.json"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; refusing to replace it." >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          # Astra + Fable Style Constitution ${tag}

          Governed release of the provider-independent Style Constitution.

          ## Included
          - Canonical machine-readable StyleSpec and deterministic validation
          - Independent Astra/Fable proposal, cross-review, bounded consensus, and exact-hash governance
          - Official MCP v2 server targeting protocol revision 2026-07-28
          - Public read resources and compliance tools; mutation/release tools disabled by default
          - Generated JSON, CSS, and TypeScript token artifacts
          - Astro documentation site and Docker packaging

          ## Release verification
          - Repository tests passed in this release run
          - Canonical validation passed
          - Generated artifacts reproducible
          - MCP production smoke passed
          - Astro production build passed
          - Docker release build passed
          - Dependency audit reported no known vulnerabilities
          - Protected Release Gate completed successfully

          Approved candidate and publication commit: ${GITHUB_SHA}.

          See the [version-specific release notes](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/V${RELEASE_VERSION}_RELEASE_NOTES.md) for design changes, compatibility, and governance limits.

          The attached build-evidence JSON contains connected verification hashes and GitHub Actions proof.
          EOF
          gh release create "$tag" "$evidence#release-evidence-${RELEASE_VERSION}.json" \
            --target "$GITHUB_SHA" \
            --title "Astra + Fable Style Constitution ${tag}" \
            --notes-file "$notes"
