name: Release Gate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to verify
        required: true
  push:
    branches: [main]
    paths:
      - package.json
permissions: { contents: read }
jobs:
  verify-release:
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm lint:eslint
      - run: pnpm typecheck:full
      - run: pnpm test
      - run: pnpm validate
      - run: pnpm generate
      - run: pnpm repro
      - run: pnpm build:docs
      - run: pnpm smoke:mcp
      - run: pnpm audit
      - run: docker build -t style-constitution:release .
      - run: RELEASE_EVIDENCE_CONNECTED=1 pnpm evidence
      - id: release_version
        name: Verify and expose release version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          actual="$(node -p \"require('./spec/manifest.json').version\")"
          if [ -n "$REQUESTED_VERSION" ] && [ "$actual" != "$REQUESTED_VERSION" ]; then
            echo "Requested release $REQUESTED_VERSION does not match manifest version $actual" >&2
            exit 1
          fi
          echo "version=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ steps.release_version.outputs.version }}
          path: releases/${{ steps.release_version.outputs.version }}-build-evidence.json
