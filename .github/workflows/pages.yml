name: Pages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy, such as v0.2.0
        required: true
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify published release and checked-out spec
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Pages deployment must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A stable semantic-version release tag is required" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if ! jq -e '.draft == false and .prerelease == false' <<< "$release" >/dev/null; then
            echo "The release must be published and stable" >&2
            exit 1
          fi
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA"; then
            echo "The released commit must be reachable from main" >&2
            exit 1
          fi
          gh release download "$RELEASE_TAG" --pattern "${version}-build-evidence.json" --dir "$RUNNER_TEMP"
          node - "$RUNNER_TEMP/${version}-build-evidence.json" "$release_sha" "$version" <<'NODE'
          const fs = require('node:fs');
          const [path, sha, version] = process.argv.slice(2);
          const evidence = JSON.parse(fs.readFileSync(path, 'utf8'));
          const checks = Object.values(evidence.verification ?? {}).filter(value => value !== 'github-release-gate');
          if (evidence.version !== version || evidence.connectedProof?.commit !== sha || evidence.verification?.scope !== 'github-release-gate' || checks.length === 0 || checks.some(value => value !== 'pass')) {
            throw new Error('Release evidence does not match the published tag and completed gate');
          }
          NODE
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { ref: '${{ env.RELEASE_SHA }}' }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:docs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/docs/dist }
  deploy:
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

