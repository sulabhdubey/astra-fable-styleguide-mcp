name: Scan tracked files and fetched Git history
description: Pinned Gitleaks with exact historical checksum exclusions and a private-file gate
runs:
  using: composite
  steps:
    - name: Install checksum-verified Gitleaks
      shell: bash
      run: |
        set -euo pipefail
        scanner_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$scanner_dir/gitleaks.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
        tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
        echo "$scanner_dir" >> "$GITHUB_PATH"
    - name: Verify detection and rejection controls
      shell: bash
      run: node scripts/test-secret-scan.mjs
    - name: Reject tracked private files
      shell: bash
      run: node scripts/check-secret-files.mjs
    - name: Scan fetched history including merge diffs
      shell: bash
      run: |
        set -euo pipefail
        test "$(gitleaks version)" = "8.30.1"
        test "$(git rev-parse --is-shallow-repository)" = "false"
        gitleaks git . --log-opts="--all --full-history -m" \
          --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore \
          --ignore-gitleaks-allow --redact=100 --no-banner --no-color --exit-code=1
